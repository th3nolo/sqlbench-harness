name: SQLite regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.11.19"
          checksum: "7035608168e106375b36d0c818d537a889c51a8625fe7f8f7cad5e62b947c368"
          enable-cache: false
      - name: Install pinned Python
        run: uv python install 3.13.7
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Check Python syntax
        run: uv run --python 3.13.7 --no-project --no-sync --offline python -m compileall -q scripts tests
      - name: Run SQLite regression suite
        run: uv run --python 3.13.7 --no-project --no-sync --offline python -m unittest discover -s tests -v
